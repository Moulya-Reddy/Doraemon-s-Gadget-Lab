services:
  - type: web
    name: doraemons-gadget-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LLM_BACKEND
        value: extractive
      - key: WEB_FALLBACK
        value: on
